<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario de Contenido IG</title>
<style>
:root{
  --bg:#f9f7f3; --card:#ffffff; --ink:#2c2a28; --muted:#8f8a83; --line:#e8e3da;
  --orange:#ef6c1a; --green:#7ab240; --orange-soft:#fdece0; --green-soft:#eef6e2;
  --pend:#e2a33c; --prog:#4a90c1; --listo:#4aa96c;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1c1a18; --card:#252220; --ink:#f2ede6; --muted:#a49e96; --line:#3a3631; --orange-soft:#3a2b1c; --green-soft:#26301c; }
}
:root[data-theme="dark"]{ --bg:#1c1a18; --card:#252220; --ink:#f2ede6; --muted:#a49e96; --line:#3a3631; --orange-soft:#3a2b1c; --green-soft:#26301c; }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{height:100%; margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; padding:20px 22px 32px;}
.header{display:flex; align-items:center; gap:12px; margin-bottom:2px;}
.header .logo-badge{background:linear-gradient(145deg,#e9e3d4,#ded6c4); border-radius:12px; padding:6px; display:inline-flex; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .header .logo-badge{ background:linear-gradient(145deg,#4a4438,#3a352c); } }
:root[data-theme="dark"] .header .logo-badge{ background:linear-gradient(145deg,#4a4438,#3a352c); }
.header img{width:38px; height:38px; object-fit:contain; display:block;}
.header h1{font-size:19px; margin:0; letter-spacing:.2px;}
.sub{color:var(--muted); font-size:12.5px; margin:2px 0 16px 52px; display:flex; align-items:center; gap:6px;}
.sub .dotlive{width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block;}
.tabs-row{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;}
.tabs{display:flex; gap:8px;}
.export-btn{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:20px; padding:7px 15px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.export-btn:hover{border-color:var(--green); color:var(--green);}
.tab{padding:7px 16px; border-radius:20px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; font-size:13.5px; font-weight:500; transition:.15s;}
.tab.active{background:var(--orange); color:#fff; border-color:var(--orange);}
.weeknav{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.weeknav button{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px;}
.weeknav button:hover{border-color:var(--orange);}
.weeknav .lbl{font-weight:600; font-size:14.5px;}
.weeknav .today-badge{font-size:11px; color:var(--green); font-weight:600; background:var(--green-soft); padding:3px 9px; border-radius:12px;}
.grid{display:grid; grid-template-columns:repeat(7,minmax(128px,1fr)); gap:9px; overflow-x:auto;}
.col{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px; min-width:128px;}
.col.is-today{border-color:var(--orange); box-shadow:0 0 0 1px var(--orange) inset;}
.col h3{font-size:11.5px; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; display:flex; justify-content:space-between; align-items:center;}
.col h3 .daynum{color:var(--ink); font-weight:700; font-size:13px;}
.post{border:1px solid var(--line); border-radius:9px; padding:7px 8px; margin-bottom:7px; font-size:12.5px; cursor:pointer; position:relative; background:var(--bg); transition:.15s;}
.post:hover{border-color:var(--orange);}
.post .type{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px;}
.post .title{margin:3px 0 5px; line-height:1.3;}
.post .del{position:absolute; top:5px; right:6px; color:var(--muted); font-size:11px; cursor:pointer; opacity:.6;}
.post .del:hover{opacity:1; color:var(--orange);}
.statuschip{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:10px;}
.st-pendiente .statuschip{background:var(--orange-soft); color:var(--pend);}
.st-en_progreso .statuschip{background:#e8f1f8; color:var(--prog);}
.st-listo .statuschip{background:var(--green-soft); color:var(--listo);}
:root[data-theme="dark"] .st-en_progreso .statuschip, @media (prefers-color-scheme: dark){ .st-en_progreso .statuschip{background:#1c2a34;} }
.addbox{margin-top:6px; position:relative;}
.addbox summary{list-style:none; cursor:pointer; font-size:12px; color:var(--orange); font-weight:600; padding:4px 2px; user-select:none;}
.addbox summary::-webkit-details-marker{display:none;}
.addbox summary::before{content:"+ "; }
.addbox[open] summary{color:var(--muted);}
.addbox[open] summary::before{content:"– ";}
.add-panel{display:flex; flex-direction:column; gap:6px; margin-top:6px; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:8px;}
.add-panel input{width:100%; font-size:12px; padding:6px 7px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--ink);}
.add-panel .row2{display:flex; gap:5px;}
.add-panel select{flex:1; font-size:11px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:4px;}
.add-panel button{border:none; background:var(--orange); color:#fff; border-radius:7px; padding:4px 12px; cursor:pointer; font-size:13px; font-weight:600;}
.loading-layer {display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(255,255,255,0.7); z-index:999; justify-content:center; align-items:center; font-weight:bold;}
</style>
</head>
<body>

<div class="loading-layer" id="loader">Sincronizando con Google Sheets...</div>

<div class="header">
  <span class="logo-badge">
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Logo" />
  </span>
  <h1>Calendario de Contenido IG</h1>
</div>
<div class="sub">
  <span class="dotlive"></span> Conectado a Sheets
</div>

<div class="tabs-row">
  <div class="tabs">
    <button class="tab active">Semana Actual</button>
  </div>
  <button class="export-btn" onclick="fetchData()">↻ Refrescar</button>
</div>

<div class="grid" id="calendar-grid">
  <!-- Las columnas se generarán dinámicamente -->
</div>

<script>
  // Script URL proporcionada
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxp9N6AaPok_ayZD4UUSQqVGWM2zW8GKg57M23pjOE08zXPJtDsl-ym3sAvtci7NAeprQ/exec';
  
  const diasSemana = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
  let localData = [];

  // 1. Inicializar la cuadrícula vacía
  function initGrid() {
    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';
    
    diasSemana.forEach(dia => {
      const colHTML = `
        <div class="col" id="col-${dia}">
          <h3>${dia} <span class="daynum"></span></h3>
          <div class="posts-container" id="posts-${dia}"></div>
          
          <details class="addbox">
            <summary>Añadir</summary>
            <form class="add-panel" onsubmit="addPost(event, '${dia}')">
              <input type="text" name="title" placeholder="Título/Tema" required>
              <div class="row2">
                <select name="type">
                  <option value="Reel">Reel</option>
                  <option value="Carrusel">Carrusel</option>
                  <option value="Historia">Historia</option>
                </select>
                <select name="status">
                  <option value="st-pendiente">Pendiente</option>
                  <option value="st-en_progreso">En Progreso</option>
                  <option value="st-listo">Listo</option>
                </select>
              </div>
              <button type="submit">Guardar</button>
            </form>
          </details>
        </div>
      `;
      grid.insertAdjacentHTML('beforeend', colHTML);
    });
  }

  // 2. Renderizar datos en la vista
  function renderPosts() {
    // Limpiar posts existentes
    diasSemana.forEach(dia => {
      document.getElementById(`posts-${dia}`).innerHTML = '';
    });

    localData.forEach((item, index) => {
      if(!item.dia || !document.getElementById(`posts-${item.dia}`)) return;

      let statusText = item.status === 'st-listo' ? 'Listo' : item.status === 'st-en_progreso' ? 'En Progreso' : 'Pendiente';
      
      const postHTML = `
        <div class="post ${item.status}">
          <div class="del" onclick="deletePost('${item.id || index}')">✖</div>
          <div class="type">${item.type}</div>
          <div class="title">${item.title}</div>
          <div class="statuschip">${statusText}</div>
        </div>
      `;
      document.getElementById(`posts-${item.dia}`).insertAdjacentHTML('beforeend', postHTML);
    });
  }

  // 3. Traer datos desde Google Sheets
  async function fetchData() {
    showLoader(true);
    try {
      const response = await fetch(SHEET_URL);
      const result = await response.json();
      // Asumiendo que el JSON devuelto es un Array de objetos: [{ dia, title, type, status, id }]
      localData = result.data || result || []; 
      renderPosts();
    } catch (error) {
      console.error("Error al cargar los datos:", error);
      alert("Hubo un error al conectar con Google Sheets.");
    } finally {
      showLoader(false);
    }
  }

  // 4. Guardar un nuevo post
  async function addPost(e, dia) {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    
    // Preparar objeto para actualización optimista
    const newPost = {
      dia: dia,
      title: formData.get('title'),
      type: formData.get('type'),
      status: formData.get('status'),
      action: 'add'
    };

    // Actualización local inmediata
    localData.push(newPost);
    renderPosts();
    form.reset();
    form.closest('details').removeAttribute('open');

    // Enviar a Google Sheets
    try {
      showLoader(true);
      // Ajustar el FormData para AppScript
      formData.append('dia', newPost.dia);
      formData.append('action', 'add');
      
      await fetch(SHEET_URL, {
        method: 'POST',
        body: formData
      });
      // Sincronizar datos de vuelta para obtener los IDs reales
      await fetchData();
    } catch (error) {
      console.error("Error al guardar:", error);
      alert("Error guardando el contenido en Sheets.");
    } finally {
      showLoader(false);
    }
  }

  // 5. Eliminar post
  async function deletePost(id) {
    if(!confirm("¿Eliminar esta publicación?")) return;
    
    showLoader(true);
    try {
      // Remover localmente para respuesta rápida
      localData = localData.filter((p, i) => p.id !== id && i.toString() !== id.toString());
      renderPosts();

      const formData = new FormData();
      formData.append('action', 'delete');
      formData.append('id', id);

      await fetch(SHEET_URL, {
        method: 'POST',
        body: formData
      });
      await fetchData();
    } catch (error) {
      console.error("Error al eliminar:", error);
    } finally {
      showLoader(false);
    }
  }

  function showLoader(show) {
    document.getElementById('loader').style.display = show ? 'flex' : 'none';
  }

  // Boot
  document.addEventListener('DOMContentLoaded', () => {
    initGrid();
    fetchData(); // Carga inicial desde sheets
  });

</script>
</body>
</html>
